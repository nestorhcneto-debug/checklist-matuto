<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D0B0A">
<link rel="icon" href="emblema.jpg">
<link rel="apple-touch-icon" href="emblema.jpg">
<meta name="apple-mobile-web-app-title" content="Checklist Matuto">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Checklist Matuto da China</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de uma coluna para celular — cabeçalho laca vermelha, cartões por setor, barra inferior fixa */
:root{
  --bg:#FBF5EC; --surface:#FFFFFF; --sunk:#F3EADD; --ink:#2B1916; --muted:#7B635C; --line:#E8DACB;
  --red:#A51F18; --red-2:#C62F25; --on-red:#FFF7EA; --gold:#D79E16;
  --ok:#24784A; --ok-bg:#E3F2E8; --warn:#A86500; --warn-bg:#FBEFD9; --bad:#B3261E; --bad-bg:#FBE4E1;
  --display:"Alfa Slab One", "Rockwell", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171110; --surface:#221917; --sunk:#2B201E; --ink:#F5ECE3; --muted:#B5A39B; --line:#3A2C29;
  --red:#8E1A14; --red-2:#E0483E; --on-red:#FFF3E2; --gold:#E9B63A;
  --ok:#5BC48A; --ok-bg:#1C3326; --warn:#EDAE4A; --warn-bg:#3A2B12; --bad:#F06A60; --bad-bg:#3C1C19;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#171110; --surface:#221917; --sunk:#2B201E; --ink:#F5ECE3; --muted:#B5A39B; --line:#3A2C29;
  --red:#8E1A14; --red-2:#E0483E; --on-red:#FFF3E2; --gold:#E9B63A;
  --ok:#5BC48A; --ok-bg:#1C3326; --warn:#EDAE4A; --warn-bg:#3A2B12; --bad:#F06A60; --bad-bg:#3C1C19;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Cabeçalho */
.hdr{background:#0D0B0A;color:#F2E6D3;position:sticky;top:0;z-index:20;
  padding-top:env(safe-area-inset-top,0px);box-shadow:0 3px 0 var(--red-2)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:#0D0B0A}
.hdr-in{display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:720px;margin:0 auto}
.logo{width:46px;height:46px;border-radius:50%;flex:none;background:#0D0B0A;display:grid;place-items:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.logo svg{width:100%;height:100%}
.brand{min-width:0;flex:1}
.esc-btn{border:1.5px solid #F2E6D3;background:none;border-radius:99px;padding:7px 14px;font-weight:700;font-size:.85rem;color:#F2E6D3;white-space:nowrap;flex:none}
.esc-btn:hover,.esc-btn[aria-current]{background:#F2E6D3;color:#0D0B0A}
@media (max-width:380px){.esc-btn{padding:6px 10px;font-size:.78rem}}
.esc-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.esc-tabs{display:flex;background:var(--sunk);border-radius:99px;padding:4px}
.esc-tabs button{border:0;background:none;border-radius:99px;padding:8px 16px;font-weight:700}
.esc-tabs button[aria-pressed="true"]{background:var(--red);color:var(--on-red)}
.esc-bar select{width:auto}
.esc-res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.95rem}
.esc-res b{color:var(--red-2)}
.esc-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.esc-head img{height:64px;width:auto;border-radius:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cal .wd{background:var(--red);color:var(--on-red);font-weight:700;text-align:center;padding:8px 4px;font-size:.8rem}
.cal .d{min-height:92px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px 7px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .d:nth-child(7n+1){border-left:0}
.cal .n{align-self:flex-end;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .wl{display:none}
.cal .out{background:var(--sunk);opacity:.5}
.cal .seg{background:var(--sunk)}.cal .seg .p{color:var(--muted);font-weight:600}
.cal .p{color:var(--red-2);font-weight:700;font-size:.78rem;text-transform:uppercase;border-radius:5px;padding:0 3px;margin:0 -3px;overflow-wrap:anywhere}
.cal .fer{font-style:italic;font-weight:600}
.cal.f .d:not(.has){opacity:.45}
.cal .me{background:var(--warn-bg);color:var(--warn)}
.esc-notas{font-size:.88rem;color:var(--muted);margin:0;padding-left:18px}
@media (max-width:760px){
 .cal{grid-template-columns:1fr}.cal .wd,.cal .out,.cal .vz{display:none}
 .cal .d{min-height:0;border-left:0;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:10px 12px}
 .cal .n{order:-1;align-self:auto;min-width:28px;font-weight:700;color:var(--ink)}
 .cal .wl{display:inline;order:-2;font-weight:700;color:var(--muted);font-size:.78rem;text-transform:uppercase;width:34px}
 .cal.f .d:not(.has){display:none}
}
.brand b{font-family:var(--display);font-weight:400;font-size:1.2rem;letter-spacing:.01em;display:block;line-height:1.1}
.brand small{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;opacity:.85;font-weight:700}

main{max-width:720px;margin:0 auto;padding-block:18px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}

h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:1.65rem;line-height:1.15}
h1 .sub{color:var(--red-2);}
h2{font-size:1.05rem;font-weight:800}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:0 0 4px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Barra de progresso */
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.bar.mid span{background:var(--gold)}

/* Painel do dia */
.today{display:flex;flex-direction:column;gap:10px}
.today .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:1.5rem;line-height:1}

.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.setor{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.setor header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.setor header .ic{width:30px;height:30px;border-radius:8px;background:var(--red);color:var(--on-red);display:grid;place-items:center;flex:none}
.setor header .ic svg{width:18px;height:18px}
.turno{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;
  padding:13px 14px;text-align:left;border-top:1px solid var(--line)}
.turno:first-of-type{border-top:0}
.turno:hover{background:var(--sunk)}
.turno .lab{font-weight:700;display:flex;align-items:center;gap:8px}
.turno .arrow{color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.chip.pend{background:var(--sunk);color:var(--muted)}
.chip.and{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.alert{background:var(--bad-bg);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

/* Checklist */
.back{border:0;background:none;color:var(--red-2);font-weight:700;padding:4px 0;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;min-width:0}
.inp:focus{border-color:var(--red-2);outline:none}
textarea.inp{min-height:84px;resize:vertical}

.prog{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:6px}
.prog .row{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem}

.itens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;transition:border-color .15s,background .15s}
.item.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok-bg) 55%,var(--surface))}
.item.out{border-color:var(--bad);background:var(--bad-bg)}
.item .tap{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:13px 14px;text-align:left}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.item.done .box{background:var(--ok);border-color:var(--ok)}
.box svg{width:16px;height:16px;opacity:0;color:#fff}
.item.done .box svg{opacity:1}
.item .txt{flex:1;min-width:0}
.item .t{font-weight:600}
.item .when{font-size:.75rem;color:var(--muted)}
.item .val{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap}
.item .val .txt{flex:1 1 160px}
.unit{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.unit .inp{width:110px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.unit.wide .inp{width:100%;text-align:left;font-weight:500}
.unit.wide{flex:1 1 100%}
.hint{font-size:.75rem;color:var(--muted)}
.item.out .hint{color:var(--bad);font-weight:700}

.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.pri{background:var(--red);color:var(--on-red)}
.btn.pri:hover{background:var(--red-2)}
.btn.wa{background:#1F8F4E;color:#fff}
.btn.sec{background:var(--sunk);color:var(--ink)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:10px}
.rowbtn{display:flex;gap:10px;flex-wrap:wrap}
.rowbtn>.btn{flex:1 1 140px}

.note{border-radius:12px;padding:12px 14px;font-size:.92rem}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note b{display:block;margin-bottom:2px}

/* Relatório */
.rep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rep-h{background:#0D0B0A;color:#F2E6D3;padding:16px;display:flex;gap:16px;align-items:center;border-bottom:3px solid var(--red-2)}
.rep-h .full{height:72px;width:auto;flex:none}
.rep-h .logo{width:52px;height:52px}
.rep-h b{font-family:var(--display);font-weight:400;font-size:1.25rem;display:block;line-height:1.1}
.rep-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:.92rem}
.rep-meta dt{color:var(--muted);font-weight:600}
.rep-meta dd{margin:0;font-weight:700;min-width:0}
.rep ul{list-style:none;margin:0;padding:6px 16px 14px}
.rep li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.rep li:last-child{border-bottom:0}
.rep li .m{flex:none;width:22px;font-weight:800}
.rep li.y .m{color:var(--ok)} .rep li.n .m{color:var(--bad)}
.rep li .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rep li.x .v{color:var(--bad)}
.rep .obs{padding:12px 16px;border-top:1px solid var(--line);font-size:.92rem}

/* Histórico */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;font-size:.88rem;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{display:flex;flex-direction:column;gap:8px}
.day h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;text-align:left}
.hrow .txt{flex:1;min-width:0}
.hrow .t{font-weight:700}
.hrow .s{font-size:.82rem;color:var(--muted)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r)}

/* Ajustes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.logo-edit{display:flex;align-items:center;gap:14px}
.logo-edit .logo{width:72px;height:72px}
.ed-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ed-item .ctl{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1;align-items:center}
.ed-item select.inp{width:auto;padding:8px}
.ed-item .mm{width:76px;padding:8px;text-align:right}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.icon-btn.del{color:var(--bad)}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;font-weight:700;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--red-2)}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-weight:700;font-size:.9rem;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="logo" id="hdrLogo"></div>
    <div class="brand"><b>Matuto da China</b><small>Checklists da casa</small></div>
    <button class="esc-btn" id="escBtn">Escala de Folgas</button>
  </div>
</header>

<main id="app"></main>

<nav class="nav" aria-label="Menu">
  <div class="nav-in">
    <button data-nav="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v3h6V3"/><path d="m8.5 13 2.5 2.5 4.5-5"/></svg>Hoje</button>
    <button data-nav="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>Histórico</button>
    <button data-nav="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
  </div>
</nav>

<div class="toast" id="toast" hidden></div>
<input type="file" id="logoFile" accept="image/*" hidden>

<script>
(function(){
"use strict";

/* ---------- Dados base ---------- */
const SETORES=[
  {id:"salao",nome:"Salão",ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10h16M6 10v9M18 10v9M8 6h8"/></svg>'},
  {id:"caixa",nome:"Caixa",ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>'},
  {id:"cozinha",nome:"Cozinha",ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11h14a0 0 0 0 1 0 0v2a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6v-2z"/><path d="M17 12h4M7 4c0 2 2 2 2 4M11 4c0 2 2 2 2 4"/></svg>'},
  {id:"producao",nome:"Produção",ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16M6 20V10l4 3V9l4 3V7l4 3v10"/></svg>'}
];
const TURNOS=[{id:"abertura",nome:"Abertura"},{id:"fechamento",nome:"Fechamento"}];

function uid(){return "i"+Math.random().toString(36).slice(2,9)}
const C=t=>({id:uid(),t,tipo:"check"});
const T=(t,min,max)=>({id:uid(),t,tipo:"temp",min,max});
const V=t=>({id:uid(),t,tipo:"valor"});
const X=t=>({id:uid(),t,tipo:"texto"});

function padrao(){return{
 salao:{
  abertura:[C("Ligar luzes, ventiladores e ar-condicionado"),C("Piso varrido e sem manchas"),C("Mesas higienizadas e alinhadas"),C("Cadeiras desempilhadas e limpas"),C("Shoyu, pimenta e molhos das mesas abastecidos"),C("Guardanapos, palitos e hashis repostos"),C("Cardápios limpos e completos"),C("Banheiros limpos com papel, sabonete e álcool"),C("Música ambiente ligada"),C("Porta e fachada limpas, placa de aberto"),C("Equipe uniformizada e briefing do dia feito")],
  fechamento:[C("Louças e copos recolhidos"),C("Mesas higienizadas"),C("Cadeiras empilhadas"),C("Piso varrido e com pano"),C("Banheiros limpos e lixo retirado"),C("Guardanapos e molhos repostos para amanhã"),C("Ar-condicionado, som, TV e luzes desligados"),C("Lixo do salão levado para fora"),C("Portas e janelas trancadas"),C("Alarme ativado")]
 },
 caixa:{

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let cfg=LS.get("mdc_cfg",null);
if(!cfg||!cfg.listas){cfg={logo:null,fone:"",pin:"1207",listas:padrao(),ultimoResp:""}}
let runs=LS.get("mdc_runs",{});

/* ---------- Utilitários ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function diaOp(){const d=new Date();if(d.getHours()<5)d.setDate(d.getDate()-1);return ymd(d)} // fechamento depois da meia-noite conta no dia anterior
const hhmm=ts=>{const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())};
function dataLonga(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}
function dataCurta(s){const [y,m,d]=s.split("-");return d+"/"+m+"/"+y}
const nomeSetor=id=>SETORES.find(s=>s.id===id).nome;
const nomeTurno=id=>TURNOS.find(t=>t.id===id).nome;
const key=(dia,s,t)=>dia+"|"+s+"|"+t;
const moeda=v=>{const n=parseFloat(String(v).replace(/\./g,"").replace(",","."));return isNaN(n)?v:n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

const LOGO_EMB="emblema.jpg";
const LOGO_FULL="logo.jpg";
const logoHTML=()=>'<img src="'+(cfg.logo||LOGO_EMB)+'" alt="Logo Matuto da China">';
function pintarLogo(){$("#hdrLogo").innerHTML=logoHTML()}

/* ---------- Estado de um checklist ---------- */
function lista(s,t){return cfg.listas[s][t]}
function itemFeito(it,r){const e=r.itens[it.id];if(!e)return false;return it.tipo==="check"?!!e.ok:(e.v!=null&&String(e.v).trim()!=="")}
function foraFaixa(it,r){if(it.tipo!=="temp")return false;const e=r.itens[it.id];if(!e||e.v==null||e.v==="")return false;const n=parseFloat(String(e.v).replace(",","."));return isNaN(n)||n<it.min||n>it.max}
function itensDe(r){return r.lista||lista(r.setor,r.turno)}
function contagem(r){const L=itensDe(r);let f=0,x=0;L.forEach(it=>{if(itemFeito(it,r))f++;if(foraFaixa(it,r))x++});return{feitos:f,total:L.length,fora:x}}
function obterRun(s,t,dia){const k=key(dia||diaOp(),s,t);if(!runs[k])runs[k]={setor:s,turno:t,dia:dia||diaOp(),resp:cfg.ultimoResp||"",inicio:null,fim:null,status:"novo",itens:{},obs:""};return runs[k]}
function marcarInicio(r){if(!r.inicio){r.inicio=Date.now();r.status="andamento"}}

/* ---------- Navegação ---------- */
let view={n:"hoje"};
function ir(v){view=v;render();window.scrollTo(0,0)}
document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>ir({n:b.dataset.nav})));

function render(){
  const app=$("#app");
  const sec={hoje:"hoje",check:"hoje",rel:view.de||"hoje",hist:"hist",ajustes:"ajustes",editar:"ajustes"}[view.n];
  document.querySelectorAll("[data-nav]").forEach(b=>{if(b.dataset.nav===sec)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  app.innerHTML=({hoje:vHoje,check:vCheck,rel:vRel,hist:vHist,ajustes:vAjustes,editar:vEditar,escala:vEscala})[view.n]();
  $("#escBtn").toggleAttribute("aria-current",view.n==="escala");
  pintarLogo();
}

/* ---------- Tela: Hoje ---------- */
function chipDe(r){
  if(!r||r.status==="novo")return'<span class="chip pend"><span class="dot"></span>Pendente</span>';
  const c=contagem(r);
  if(r.status==="concluido"){
    const alerta=c.fora>0||c.feitos<c.total;
    return'<span class="chip '+(alerta?"alert":"ok")+'">'+(alerta?"! ":"✓ ")+hhmm(r.fim)+(r.resp?" · "+esc(r.resp.split(" ")[0]):"")+'</span>';
  }
  return'<span class="chip and num"><span class="dot"></span>'+c.feitos+"/"+c.total+'</span>';
}
function vHoje(){
  const dia=diaOp();let feitos=0;
  SETORES.forEach(s=>TURNOS.forEach(t=>{const r=runs[key(dia,s.id,t.id)];if(r&&r.status==="concluido")feitos++}));
  const pct=Math.round(feitos/8*100);
  let h='<section class="today"><div><p class="eyebrow">Dia de operação</p><h1>'+esc(dataLonga(dia).replace(/^./,c=>c.toUpperCase()))+'</h1></div>'+
    '<div class="row"><span><span class="big num">'+feitos+'</span><span class="muted"> de 8 checklists concluídos</span></span><span class="muted num">'+pct+'%</span></div>'+
    '<div class="bar'+(pct<100?" mid":"")+'"><span style="width:'+pct+'%"></span></div></section><div class="grid">';
  SETORES.forEach(s=>{
    h+='<article class="setor"><header><span class="ic">'+s.ic+'</span><h2>'+s.nome+'</h2></header>';
    TURNOS.forEach(t=>{const r=runs[key(dia,s.id,t.id)];
      h+='<button class="turno" data-abrir="'+s.id+'|'+t.id+'"><span class="lab">'+t.nome+'</span><span style="display:flex;align-items:center;gap:8px">'+chipDe(r)+'<span class="arrow">›</span></span></button>'});
    h+='</article>';
  });
  h+='</div><p class="muted" style="font-size:.85rem;margin:0">Fechamentos feitos até as 5h da manhã contam no dia anterior.</p>';
  return h;
}

/* ---------- Tela: Checklist ---------- */
function linhaItem(it,r){
  const e=r.itens[it.id]||{};const feito=itemFeito(it,r),fora=foraFaixa(it,r);
  const cls="item"+(feito?" done":"")+(fora?" out":"");
  const quando=e.h?'<div class="when">Feito às '+hhmm(e.h)+'</div>':"";
  if(it.tipo==="check"){
    return'<li class="'+cls+'" data-id="'+it.id+'"><button class="tap" data-toggle="'+it.id+'" aria-pressed="'+feito+'"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span><span class="txt"><div class="t">'+esc(it.t)+'</div>'+quando+'</span></button></li>';
  }
  let campo,hint="";
  if(it.tipo==="temp"){campo='<div class="unit"><input class="inp" id="v_'+it.id+'" data-val="'+it.id+'" inputmode="decimal" placeholder="0" value="'+esc(e.v||"")+'"><b>°C</b></div>';
    hint='<div class="hint">'+(fora?"Fora da faixa! Ideal: ":"Ideal: ")+it.min+" a "+it.max+' °C</div>'}
  else if(it.tipo==="valor"){campo='<div class="unit"><b>R$</b><input class="inp" id="v_'+it.id+'" data-val="'+it.id+'" inputmode="decimal" placeholder="0,00" value="'+esc(e.v||"")+'"></div>'}
  else{campo='<div class="unit wide"><input class="inp" id="v_'+it.id+'" data-val="'+it.id+'" placeholder="Escreva aqui" value="'+esc(e.v||"")+'"></div>'}
  return'<li class="'+cls+'" data-id="'+it.id+'"><div class="val"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span><span class="txt"><div class="t">'+esc(it.t)+'</div>'+hint+'</span>'+campo+'</div></li>';
}
function vCheck(){
  const r=runs[view.k];const L=itensDe(r);const c=contagem(r);
  const pct=c.total?Math.round(c.feitos/c.total*100):0;
  let h='<button class="back" data-ir="hoje">‹ Hoje</button>'+
    '<div><p class="eyebrow">'+esc(dataCurta(r.dia))+'</p><h1>'+nomeSetor(r.setor)+' <span class="sub">· '+nomeTurno(r.turno)+'</span></h1></div>'+
    '<label class="field"><span>Responsável</span><input class="inp" id="resp" autocomplete="name" placeholder="Seu nome" value="'+esc(r.resp)+'"></label>'+
    '<div class="prog"><div class="row"><span id="pTxt" class="num">'+c.feitos+' de '+c.total+' itens</span><span id="pPct" class="num muted">'+pct+'%</span></div><div class="bar'+(pct<100?" mid":"")+'" id="pBar"><span style="width:'+pct+'%"></span></div></div>'+
    '<ol class="itens">'+L.map(it=>linhaItem(it,r)).join("")+'</ol>'+
    '<label class="field"><span>Observações</span><textarea class="inp" id="obs" placeholder="Algo quebrado, faltando ou fora do normal?">'+esc(r.obs)+'</textarea></label>'+
    '<div id="fimArea" class="stack"><button class="btn pri" data-concluir>Concluir checklist</button></div>';
  return h;
}
function atualizarProg(r){
  const c=contagem(r),pct=c.total?Math.round(c.feitos/c.total*100):0;
  $("#pTxt").textContent=c.feitos+" de "+c.total+" itens";$("#pPct").textContent=pct+"%";
  $("#pBar").className="bar"+(pct<100?" mid":"");$("#pBar span").style.width=pct+"%";
}
function tentarConcluir(forcar){
  const r=runs[view.k];const c=contagem(r);const area=$("#fimArea");
  if(!r.resp.trim()){area.innerHTML='<div class="note bad"><b>Falta o nome do responsável.</b>Preencha o campo lá em cima para concluir.</div><button class="btn pri" data-concluir>Concluir checklist</button>';$("#resp").focus();return}
  const pend=c.total-c.feitos;
  if(!forcar&&(pend>0||c.fora>0)){
    let msg=[];if(pend>0)msg.push(pend+(pend>1?" itens ainda não foram feitos":" item ainda não foi feito"));if(c.fora>0)msg.push(c.fora+(c.fora>1?" temperaturas fora da faixa":" temperatura fora da faixa"));
    area.innerHTML='<div class="note warn"><b>Atenção: '+msg.join(" e ")+'.</b>Eles vão aparecer como pendência no relatório. Explique nas observações, se puder.</div><div class="rowbtn"><button class="btn sec" data-voltaritens>Voltar aos itens</button><button class="btn pri" data-forcar>Concluir mesmo assim</button></div>';
    area.scrollIntoView({behavior:"smooth",block:"center"});return;
  }
  marcarInicio(r);r.fim=Date.now();r.status="concluido";r.lista=JSON.parse(JSON.stringify(itensDe(r)));
  cfg.ultimoResp=r.resp.trim();salvar();ir({n:"rel",k:view.k,novo:true});
}

/* ---------- Relatório ---------- */
function valorTexto(it,e){if(!e||e.v==null||e.v==="")return"";if(it.tipo==="temp")return String(e.v).replace(".",",")+" °C";if(it.tipo==="valor")return moeda(e.v);return e.v}
function textoRelatorio(r){
  const c=contagem(r);const L=itensDe(r);
  let s="*MATUTO DA CHINA*\n";
  s+=(c.feitos===c.total&&!c.fora?"✅":"⚠️")+" Checklist "+nomeSetor(r.setor)+" · "+nomeTurno(r.turno)+"\n";
  s+="📅 "+dataCurta(r.dia)+"   ⏰ "+(r.inicio?hhmm(r.inicio)+"–":"")+hhmm(r.fim)+"\n";
  s+="👤 "+r.resp+"\n";
  s+="Concluído: "+c.feitos+"/"+c.total+"\n";
  const vals=L.filter(it=>it.tipo!=="check"&&itemFeito(it,r));
  if(vals.length){s+="\n";vals.forEach(it=>{s+=(foraFaixa(it,r)?"❗ ":"• ")+it.t+": "+valorTexto(it,r.itens[it.id])+(foraFaixa(it,r)?" (fora de "+it.min+" a "+it.max+" °C)":"")+"\n"})}
  const pend=L.filter(it=>!itemFeito(it,r));
  if(pend.length){s+="\n*Pendentes:*\n";pend.forEach(it=>s+="✗ "+it.t+"\n")}
  if(r.obs&&r.obs.trim())s+="\n📝 "+r.obs.trim()+"\n";
  return s;
}
function vRel(){
  const r=runs[view.k];const c=contagem(r);const L=itensDe(r);

  let h='<button class="back" data-ir="'+(view.de||"hoje")+'">‹ '+(view.de==="hist"?"Histórico":"Hoje")+'</button>';
  if(view.novo)h+='<div class="note '+(ok?"ok":"warn")+'"><b>'+(ok?"Checklist concluído.":"Checklist concluído com pendências.")+'</b>Envie o relatório para a gerência pelo WhatsApp.</div>';
  h+='<article class="rep"><div class="rep-h">'+(cfg.logo?'<div class="logo" style="width:60px;height:60px">'+logoHTML()+'</div>':'<img class="full" src="'+LOGO_FULL+'" alt="Matuto da China">')+'<div><b>'+nomeSetor(r.setor)+' · '+nomeTurno(r.turno)+'</b><span>Matuto da China</span></div></div>'+
    '<dl class="rep-meta num"><dt>Data</dt><dd>'+dataCurta(r.dia)+'</dd><dt>Horário</dt><dd>'+(r.inicio?hhmm(r.inicio)+" às ":"")+hhmm(r.fim)+'</dd><dt>Responsável</dt><dd>'+esc(r.resp)+'</dd><dt>Resultado</dt><dd>'+c.feitos+' de '+c.total+' itens'+(c.fora?" · "+c.fora+" fora da faixa":"")+'</dd></dl><ul>';
  L.forEach(it=>{const f=itemFeito(it,r),x=foraFaixa(it,r),e=r.itens[it.id];
    h+='<li class="'+(f?"y":"n")+(x?" x":"")+'"><span class="m">'+(f?"✓":"✗")+'</span><span>'+esc(it.t)+(e&&e.h&&it.tipo==="check"?' <span class="muted num" style="font-size:.8rem">'+hhmm(e.h)+'</span>':"")+'</span>'+(it.tipo!=="check"&&f?'<span class="v">'+esc(valorTexto(it,e))+'</span>':"")+'</li>'});
  h+='</ul>'+(r.obs&&r.obs.trim()?'<div class="obs"><b>Observações:</b> '+esc(r.obs)+'</div>':"")+'</article>';
  h+='<div class="stack"><a class="btn wa" href="'+wa+'" target="_blank" rel="noopener"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>Enviar no WhatsApp</a>'+
    '<div class="rowbtn"><button class="btn sec" data-copiar>Copiar texto</button>'+(r.dia===diaOp()?'<button class="btn ghost" data-reabrir>Reabrir para corrigir</button>':"")+'</div>'+
    (fone?"":'<p class="muted" style="font-size:.85rem;margin:0">Dica: cadastre o WhatsApp da gerência em Ajustes para o relatório já ir para a conversa certa.</p>')+'</div>';
  return h;
}

/* ---------- Histórico ---------- */
let filtro="todos";
function vHist(){
  const lista=Object.entries(runs).filter(([,r])=>r.status==="concluido"&&(filtro==="todos"||r.setor===filtro)).sort((a,b)=>b[1].fim-a[1].fim).slice(0,120);
  let h='<div><p class="eyebrow">Registros deste aparelho</p><h1>Histórico</h1></div><div class="filters">'+
    [{id:"todos",nome:"Todos"}].concat(SETORES).map(s=>'<button class="fchip" data-filtro="'+s.id+'" aria-pressed="'+(filtro===s.id)+'">'+s.nome+'</button>').join("")+'</div>';
  if(!lista.length)return h+'<div class="empty">Nenhum checklist concluído ainda.<br>Os registros aparecem aqui assim que alguém conclui um checklist em <b>Hoje</b>.</div>';
  let dia="";
  lista.forEach(([k,r])=>{
    if(r.dia!==dia){if(dia)h+='</div>';dia=r.dia;h+='<div class="day"><h3>'+esc(dataLonga(dia))+'</h3>'}
    const c=contagem(r);const al=c.fora>0||c.feitos<c.total;
    h+='<button class="hrow" data-rel="'+esc(k)+'"><span class="txt"><div class="t">'+nomeSetor(r.setor)+' · '+nomeTurno(r.turno)+'</div><div class="s num">'+hhmm(r.fim)+' · '+esc(r.resp)+'</div></span><span class="chip '+(al?"alert":"ok")+' num">'+c.feitos+'/'+c.total+'</span></button>';
  });
  return h+'</div>';
}

function vEditar(){

    h+='<div class="ed-item" data-eid="'+it.id+'"><input class="inp" id="e_'+it.id+'" data-et="'+it.id+'" value="'+esc(it.t)+'"><button class="icon-btn del" data-edel="'+it.id+'" aria-label="Remover item">✕</button><div class="ctl">'+
      '<select class="inp" id="s_'+it.id+'" data-etipo="'+it.id+'">'+[["check","Marcar ✓"],["temp","Temperatura °C"],["valor","Valor R$"],["texto","Texto"]].map(([v,n])=>'<option value="'+v+'"'+(it.tipo===v?" selected":"")+'>'+n+'</option>').join("")+'</select>'+
      (it.tipo==="temp"?'<span class="muted">de</span><input class="inp mm" id="mn_'+it.id+'" data-emin="'+it.id+'" inputmode="decimal" value="'+it.min+'"><span class="muted">a</span><input class="inp mm" id="mx_'+it.id+'" data-emax="'+it.id+'" inputmode="decimal" value="'+it.max+'"><span class="muted">°C</span>':"")+
      '<span style="margin-left:auto;display:flex;gap:6px"><button class="icon-btn" data-eup="'+it.id+'" aria-label="Subir"'+(i===0?" disabled":"")+'>↑</button><button class="icon-btn" data-edown="'+it.id+'" aria-label="Descer"'+(i===L.length-1?" disabled":"")+'>↓</button></span></div></div>';
  });
  h+='</div><button class="btn sec" data-eadd>+ Adicionar item</button><button class="btn ghost" data-erestaurar>Restaurar lista padrão</button><p class="muted" style="margin:0;font-size:.85rem">As mudanças valem para os próximos checklists. Os já concluídos continuam como foram feitos.</p>';
  return h;
}

/* ---------- Eventos ---------- */
const app=$("#app");
app.addEventListener("click",ev=>{
  const b=ev.target.closest("button,[data-rel]");if(!b)return;const d=b.dataset;
  if(d.ir){ir({n:d.ir});return}
  if(d.abrir){const [s,t]=d.abrir.split("|");const r=obterRun(s,t);salvar();
    if(r.status==="concluido")ir({n:"rel",k:key(r.dia,s,t)});else ir({n:"check",k:key(r.dia,s,t)});return}
  if(d.toggle){const r=runs[view.k];marcarInicio(r);const e=r.itens[d.toggle]||(r.itens[d.toggle]={});e.ok=!e.ok;e.h=e.ok?Date.now():null;salvar();
    const it=itensDe(r).find(x=>x.id===d.toggle);const li=b.closest("li");li.outerHTML=linhaItem(it,r);atualizarProg(r);return}
  if("concluir" in d){tentarConcluir(false);return}
  if("forcar" in d){tentarConcluir(true);return}
  if("voltaritens" in d){$("#fimArea").innerHTML='<button class="btn pri" data-concluir>Concluir checklist</button>';const p=app.querySelector(".item:not(.done)");if(p)p.scrollIntoView({behavior:"smooth",block:"center"});return}
  if("copiar" in d){const txt=textoRelatorio(runs[view.k]);
    const fb=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Texto copiado")}catch(e){toast("Selecione e copie o texto manualmente")}ta.remove()};
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("Texto copiado"),fb);else fb();return}
  if("reabrir" in d){const r=runs[view.k];r.status="andamento";r.fim=null;delete r.lista;salvar();ir({n:"check",k:view.k});return}
  if(d.rel){ir({n:"rel",k:d.rel,de:"hist"});return}
  if(d.filtro){filtro=d.filtro;render();return}
  if("logo" in d){$("#logoFile").click();return}
  if("semlogo" in d){cfg.logo=null;salvar();render();return}
  if("pin" in d){if($("#pin").value===String(cfg.pin)){liberado=true;render()}else{toast("Senha incorreta")}return}
  if("novopin" in d){const v=$("#novoPin").value.trim();if(v.length<4){toast("Use pelo menos 4 dígitos");return}cfg.pin=v;salvar();toast("Senha trocada");$("#novoPin").value="";return}
  if(d.editar){const [s,t]=d.editar.split("|");ir({n:"editar",s,t});return}
  if("limpar" in d){$("#limparArea").innerHTML='<div class="note bad"><b>Apagar todos os checklists deste aparelho?</b>Isso não pode ser desfeito.</div><div class="rowbtn" style="margin-top:8px"><button class="btn sec sm" data-ir="ajustes">Cancelar</button><button class="btn danger sm" data-limparok>Apagar</button></div>';return}
  if("limparok" in d){runs={};salvar();toast("Histórico apagado");render();return}
  // editor
  const L=view.n==="editar"?lista(view.s,view.t):null;
  if(L){
    const idx=id=>L.findIndex(x=>x.id===id);
    if(d.edel){L.splice(idx(d.edel),1);salvar();render();return}
    if(d.eup){const i=idx(d.eup);[L[i-1],L[i]]=[L[i],L[i-1]];salvar();render();return}
    if(d.edown){const i=idx(d.edown);[L[i+1],L[i]]=[L[i],L[i+1]];salvar();render();return}
    if("eadd" in d){const n=C("Novo item");L.push(n);salvar();render();const el=$("#e_"+n.id);if(el){el.focus();el.select()}return}
    if("erestaurar" in d){cfg.listas[view.s][view.t]=padrao()[view.s][view.t];salvar();toast("Lista padrão restaurada");render();return}
  }
});
app.addEventListener("input",ev=>{
  const el=ev.target,d=el.dataset;
  if(el.id==="resp"){runs[view.k].resp=el.value;salvar();return}
  if(el.id==="obs"){runs[view.k].obs=el.value;salvar();return}
  if(el.id==="fone"){cfg.fone=el.value;salvar();return}
  if(d.val){const r=runs[view.k];marcarInicio(r);const e=r.itens[d.val]||(r.itens[d.val]={});e.v=el.value;e.h=el.value.trim()?Date.now():null;salvar();
    const it=itensDe(r).find(x=>x.id===d.val);const li=el.closest("li");const f=itemFeito(it,r),x=foraFaixa(it,r);
    li.classList.toggle("done",f);li.classList.toggle("out",x);const hn=li.querySelector(".hint");if(hn)hn.textContent=(x?"Fora da faixa! Ideal: ":"Ideal: ")+it.min+" a "+it.max+" °C";atualizarProg(r);return}
  if(view.n==="editar"){const L=lista(view.s,view.t);const f=id=>L.find(x=>x.id===id);
    if(d.et){f(d.et).t=el.value;salvar();return}
    if(d.emin){const n=parseFloat(el.value.replace(",","."));if(!isNaN(n)){f(d.emin).min=n;salvar()}return}
    if(d.emax){const n=parseFloat(el.value.replace(",","."));if(!isNaN(n)){f(d.emax).max=n;salvar()}return}
  }
});
app.addEventListener("change",ev=>{
  const d=ev.target.dataset;
  if(d.etipo){const it=lista(view.s,view.t).find(x=>x.id===d.etipo);it.tipo=ev.target.value;if(it.tipo==="temp"&&it.min==null){it.min=0;it.max=5}salvar();render()}
});
app.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="pin"){ev.preventDefault();app.querySelector("[data-pin]").click()}});

$("#logoFile").addEventListener("change",ev=>{
  const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{const S=256,cv=document.createElement("canvas");cv.width=cv.height=S;const x=cv.getContext("2d");
      const k=Math.max(S/img.width,S/img.height),w=img.width*k,h=img.height*k;x.fillStyle="#fff";x.fillRect(0,0,S,S);x.drawImage(img,(S-w)/2,(S-h)/2,w,h);
      cfg.logo=cv.toDataURL("image/jpeg",.85);salvar();render();toast("Logo atualizada")};img.src=rd.result};
  rd.readAsDataURL(f);ev.target.value="";
});

/* ---------- Escala de folgas ---------- */
const ESCALA={"Outubro 2026":{"ano":2026,"mes":10,"folgas":{"1":["Maria","Vania"],"2":["Jaciane","Rayssa"],"3":["Aline","Juliete"],"4":["Gabriel","Eva","Andrea"],"6":["Sávio","Jaciane"],"7":["Priscilla","Rayssa"],"8":["Maria"],"9":["Aline"],"10":["Juliete","Vania"],"11":["Vania","Sávio","Maria"],"13":["Gabriel","Aline"],"14":["Priscilla"],"15":["Eva"],"16":["Jaciane","Andrea"],"17":["Juliete"],"18":["Juliete","Jaciane"],"20":["Sávio","Eva"],"21":["Edilza","Andrea"],"22":["Gabriel","Aline"],"23":["Maria","Priscilla"],"24":["Vania"],"25":["Aline","Priscilla"],"27":["Gabriel","Andrea"],"28":["Maria","Sávio"],"29":["Edilza"],"30":["Jaciane","Vania"],"31":["Juliete","Eva"]},"ferias":{"Rayssa":[15,31]},"notas":["Dias 02 e 09: Juliete à noite","Rayssa de férias a partir de 15/10"]},"Novembro 2026":{"ano":2026,"mes":11,"folgas":{"1":["Maria","Sávio","Edilza"],"3":["Jaciane","Eva"],"4":["Aline","Juliete"],"5":["Gabriel","Andrea"],"6":["Vania","Priscilla"],"8":["Jaciane","Juliete","Gabriel"],"10":["Andrea","Priscilla"],"11":["Eva","Sávio"],"12":["Maria","Vania"],"13":["Aline","Edilza"],"15":["Vania","Eva","Andrea"],"17":["Rayssa","Edilza"],"18":["Maria","Juliete"],"19":["Gabriel","Priscilla"],"20":["Jaciane","Sávio"],"21":["Aline"],"22":["Rayssa","Aline","Priscilla"],"24":["Maria","Jaciane"],"25":["Vania","Gabriel"],"26":["Juliete","Sávio"],"27":["Andrea","Edilza"],"28":["Eva"],"29":["Maria","Sávio","Edilza"]},"ferias":{"Rayssa":[1,13]},"notas":["Rayssa de férias até 13/11 (retorno 14/11) — confirmar","Feriados: 02/11 (segunda, fechado), 15/11 (domingo), 20/11 (sexta)"]}};
const NOMES=["Maria","Vania","Jaciane","Rayssa","Aline","Juliete","Gabriel","Eva","Andrea","Sávio","Priscilla","Edilza"];
const MESES=Object.keys(ESCALA);
let escMes=(()=>{const h=new Date();return MESES.find(k=>ESCALA[k].ano===h.getFullYear()&&ESCALA[k].mes===h.getMonth()+1)||MESES[MESES.length-1]})();
let escQuem=LS.get("mdc_escquem","");
function vEscala(){
  const m=ESCALA[escMes],y=m.ano,mo=m.mes-1,dias=new Date(y,mo+1,0).getDate(),ini=new Date(y,mo,1).getDay();
  const WD=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"],WS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  let c='<div class="cal'+(escQuem?" f":"")+'">'+WD.map(w=>'<div class="wd">'+w+'</div>').join(""),tot=0,dom=[];
  for(let i=0;i<ini;i++)c+='<div class="d out"></div>';
  for(let d=1;d<=dias;d++){
    const wd=(ini+d-1)%7,L=m.folgas[d]||[];let fer="";
    for(const f in m.ferias){if(d===m.ferias[f][0]&&L.indexOf(f)<0)fer+='<span class="p fer">Férias '+esc(f)+'</span>'}
    const has=escQuem&&L.indexOf(escQuem)>=0;if(has){tot++;if(wd===0)dom.push(d)}
    const body=wd===1?'<span class="p">Fechado</span>':L.map(n=>'<span class="p'+(n===escQuem?" me":"")+'">'+esc(n)+'</span>').join("")+fer;
    c+='<div class="d'+(wd===1?" seg":"")+(has?" has":"")+(!L.length&&!fer&&wd!==1?" vz":"")+'"><span class="wl">'+WS[wd]+'</span><span class="n">'+d+'</span>'+body+'</div>';
  }
  const resto=(7-(ini+dias)%7)%7;for(let i=0;i<resto;i++)c+='<div class="d out"></div>';
  c+='</div>';
  const res=escQuem?'<b>'+esc(escQuem)+'</b>: '+tot+' folga'+(tot===1?"":"s")+' em '+escMes.split(" ")[0].toLowerCase()+' além das segundas'+(dom.length?' · domingo'+(dom.length>1?"s ":" ")+dom.join(" e "):' · <b>sem domingo neste mês</b>')+'.'
    :'Escala 5x2: segunda é fechado (folga de todos) e cada pessoa tem mais 1 folga na semana, com pelo menos 1 domingo no mês. Escolha seu nome para ver só as suas folgas.';
  return '<button class="back" data-ir="hoje">‹ Hoje</button>'+
    '<div class="esc-head"><img src="'+LOGO_FULL+'" alt="Matuto da China"><div><p class="eyebrow">Escala de folgas</p><h1>Calendário · '+esc(escMes)+'</h1></div></div>'+
    '<div class="esc-bar"><div class="esc-tabs">'+MESES.map(k=>'<button data-mes="'+k+'" aria-pressed="'+(k===escMes)+'">'+k.split(" ")[0]+'</button>').join("")+'</div>'+
    '<select class="inp" id="escSel" aria-label="Ver folgas de"><option value="">Todos</option>'+NOMES.map(n=>'<option'+(n===escQuem?" selected":"")+'>'+n+'</option>').join("")+'</select></div>'+
    '<div class="esc-res">'+res+'</div>'+c+'<ul class="esc-notas">'+(m.notas||[]).map(n=>'<li>'+esc(n)+'</li>').join("")+'</ul>';
}
$("#escBtn").addEventListener("click",()=>ir({n:"escala"}));
app.addEventListener("click",ev=>{const b=ev.target.closest("[data-mes]");if(b){escMes=b.dataset.mes;render()}});
app.addEventListener("change",ev=>{if(ev.target.id==="escSel"){escQuem=ev.target.value;LS.set("mdc_escquem",escQuem);render()}});

render();
})();
