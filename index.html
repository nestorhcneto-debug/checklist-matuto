<style>
:root{
 --bg:#FBF5EC;--surface:#FFFFFF;--sunk:#F3EADD;--ink:#2B1916;--muted:#7B635C;--line:#E8DACB;

 --display:"Alfa Slab One","Rockwell",Georgia,serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#171110;--surface:#221917;--sunk:#2B201E;--ink:#F5ECE3;--muted:#B5A39B;--line:#3A2C29;
 --red:#8E1A14;--red-2:#E0483E;--on-red:#FFF3E2;--gold:#E9B63A;
 --ok:#5BC48A;--ok-bg:#1C3326;--warn:#EDAE4A;--warn-bg:#3A2B12;--bad:#F06A60;--bad-bg:#3C1C19;--info:#7DB6E8;--info-bg:#17293A;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#171110;--surface:#221917;--sunk:#2B201E;--ink:#F5ECE3;--muted:#B5A39B;--line:#3A2C29;
 --red:#8E1A14;--red-2:#E0483E;--on-red:#FFF3E2;--gold:#E9B63A;
 --ok:#5BC48A;--ok-bg:#1C3326;--warn:#EDAE4A;--warn-bg:#3A2B12;--bad:#F06A60;--bad-bg:#3C1C19;--info:#7DB6E8;--info-bg:#17293A;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hdr{background:#0D0B0A;color:#F2E6D3;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);box-shadow:0 3px 0 var(--red-2)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:#0D0B0A}
.hdr-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
.logo{width:46px;height:46px;border-radius:50%;flex:none;background:#0D0B0A;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}

.brand small{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;opacity:.85;font-weight:700}
.esc-btn{border:1.5px solid #F2E6D3;background:none;border-radius:99px;padding:7px 14px;font-weight:700;font-size:.85rem;color:#F2E6D3;white-space:nowrap;flex:none}
.esc-btn:hover,.esc-btn[aria-current]{background:#F2E6D3;color:#0D0B0A}
main{max-width:1180px;margin:0 auto;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:1.65rem;line-height:1.15}h1 .sub{color:var(--red-2)}
h2{font-size:1.05rem;font-weight:800}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:0 0 4px}
.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}.small{font-size:.85rem}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}.bar span{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}.bar.mid span{background:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:1.5rem;line-height:1}
.grid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:640px){.grid.g2,.grid.g3{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.grid.g3{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card>header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card>header h2{flex:1}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ic{width:30px;height:30px;border-radius:8px;background:var(--red);color:var(--on-red);display:grid;place-items:center;flex:none}.ic svg{width:18px;height:18px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;border-top:1px solid var(--line)}
.card>header+.line{border-top:0}
button.line:hover{background:var(--sunk)}
.line .lab{font-weight:700;min-width:0}.line .lab small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.chip.pend{background:var(--sunk);color:var(--muted)}.chip.and{background:var(--warn-bg);color:var(--warn)}.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.alert{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--sunk);border-radius:8px;padding:4px 10px;font-weight:700;font-size:.85rem}.tag.r{background:var(--bad-bg);color:var(--bad)}.tag.g{background:var(--ok-bg);color:var(--ok)}
.back{border:0;background:none;color:var(--red-2);font-weight:700;padding:4px 0;align-self:flex-start}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;min-width:0}
.inp:focus{border-color:var(--red-2);outline:none}textarea.inp{min-height:80px;resize:vertical}
select.inp{padding:10px}
.prog{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:6px}
.prog .row{font-weight:700;font-size:.9rem}
.itens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
.item.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok-bg) 55%,var(--surface))}
.item.out{border-color:var(--bad);background:var(--bad-bg)}
.item .tap{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:14px;text-align:left}
.box{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.done .box{background:var(--ok);border-color:var(--ok)}.box svg{width:16px;height:16px;opacity:0;color:#fff}.done .box svg{opacity:1}
.item .txt{flex:1;min-width:0}.item .t{font-weight:600}.item .when{font-size:.75rem;color:var(--muted)}
.item .val{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap}.item .val .txt{flex:1 1 160px}
.unit{display:flex;align-items:center;gap:6px}.unit .inp{width:110px;text-align:right;font-weight:700}
.hint{font-size:.75rem;color:var(--muted)}.item.out .hint{color:var(--bad);font-weight:700}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.pri{background:var(--red);color:var(--on-red)}.btn.pri:hover{background:var(--red-2)}
.btn.wa{background:#1F8F4E;color:#fff}.btn.sec{background:var(--sunk);color:var(--ink)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:10px}.btn.xs{padding:5px 10px;font-size:.8rem;border-radius:8px}
.stack{display:flex;flex-direction:column;gap:10px}.rowbtn{display:flex;gap:10px;flex-wrap:wrap}.rowbtn>.btn{flex:1 1 140px}
.note{border-radius:12px;padding:12px 14px;font-size:.92rem}.note b{display:block;margin-bottom:2px}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.ok{background:var(--ok-bg);color:var(--ok)}.note.info{background:var(--info-bg);color:var(--info)}
.tabs{display:flex;background:var(--sunk);border-radius:99px;padding:4px;flex-wrap:wrap;align-self:flex-start}
.tabs button{border:0;background:none;border-radius:99px;padding:8px 16px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--red);color:var(--on-red)}
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tool select.inp{width:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .inp{padding:8px 10px}
.scroll{overflow-x:auto}
.ptbl td:first-child{font-weight:600;min-width:150px}.ptbl .q{width:110px}.ptbl tr.feito td:first-child{color:var(--ok)}
.ptbl tr.sem td{color:var(--muted)}.ptbl tr.sem td:first-child{text-decoration:line-through}
.ltbl td.c{text-align:center;min-width:120px}.ltbl th.cur,.ltbl td.cur{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px}.cell .who{font-weight:700;font-size:.85rem}
.cell .ok{color:var(--ok);font-size:.75rem;font-weight:700}
.sign{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}.sign select{width:auto;padding:6px}
details.av{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.av summary{font-weight:700;cursor:pointer}details.av p{margin:.5em 0;font-size:.9rem}
.rep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rep-h{background:#0D0B0A;color:#F2E6D3;padding:16px;display:flex;gap:16px;align-items:center;border-bottom:3px solid var(--red-2)}
.rep-h img{height:72px;width:auto}.rep-h b{font-family:var(--display);font-weight:400;font-size:1.25rem;display:block;line-height:1.1}
.rep-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:.92rem}
.rep-meta dt{color:var(--muted);font-weight:600}.rep-meta dd{margin:0;font-weight:700;min-width:0}
.rep ul{list-style:none;margin:0;padding:6px 16px 14px}.rep li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.rep li:last-child{border-bottom:0}
.rep li .m{flex:none;width:22px;font-weight:800}.rep li.y .m{color:var(--ok)}.rep li.n .m{color:var(--bad)}
.rep li .v{margin-left:auto;font-weight:700;white-space:nowrap}.rep li.x .v{color:var(--bad)}.rep .obs{padding:12px 16px;border-top:1px solid var(--line);font-size:.92rem}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;font-size:.88rem;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;text-align:left}
.hrow .txt{flex:1;min-width:0}.hrow .t{font-weight:700}.hrow .s{font-size:.82rem;color:var(--muted)}
.vazio{text-align:center;padding:26px 16px;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r)}
.ed-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ed-item .ctl{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1;align-items:center}.ed-item select.inp{width:auto;padding:8px}.ed-item .mm{width:76px;padding:8px;text-align:right}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;flex:none}.icon-btn.del{color:var(--bad)}
.esc-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.esc-head img{height:64px;width:auto;border-radius:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cal .wd{background:var(--red);color:var(--on-red);font-weight:700;text-align:center;padding:8px 4px;font-size:.8rem}
.cal .d{min-height:92px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px 7px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .d:nth-child(7n+1){border-left:0}
.cal .n{align-self:flex-end;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .wl{display:none}.cal .out{background:var(--sunk);opacity:.5}.cal .hoje{box-shadow:inset 0 0 0 2px var(--gold)}
.cal .seg{background:var(--sunk)}.cal .seg .p{color:var(--muted);font-weight:600}
.cal .p{color:var(--red-2);font-weight:700;font-size:.78rem;text-transform:uppercase;border-radius:5px;padding:0 3px;margin:0 -3px;overflow-wrap:anywhere}
.cal .fer{font-style:italic;font-weight:600}.cal .cp{color:var(--info)}.cal .fe{color:var(--warn);font-size:.72rem}
.cal.f .d:not(.has){opacity:.45}.cal .me{background:var(--warn-bg);color:var(--warn)}
.esc-res{background:var(--info-bg);border-radius:12px;padding:12px 14px;font-size:.95rem}.esc-res b{color:var(--red-2)}
.esc-notas{font-size:.88rem;color:var(--muted);margin:0;padding-left:18px}
.cal.ed .d:not(.out){cursor:pointer}.cal.ed .d:not(.out):hover{outline:2px solid var(--gold);outline-offset:-2px}.cal .sel{box-shadow:inset 0 0 0 3px var(--red-2)}
.tog{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-weight:700;font-size:.85rem}
.tog[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}.tog.cp[aria-pressed="true"]{background:var(--info);border-color:var(--info);color:#fff}
.warns{margin:0;padding-left:18px;font-size:.88rem}
.sy{font-weight:800;color:var(--muted)}.sy.ok{color:var(--ok)}.sy.bad{color:var(--bad)}.sy.off{color:var(--muted)}
.oco .body{gap:8px}.oco-t{margin:0;font-size:1rem;white-space:pre-wrap}.oco.res{opacity:.7}
.line.oco-alert{border:1px solid var(--bad);background:var(--bad-bg);border-radius:12px;color:var(--bad)}.line.oco-alert small{color:var(--ink,inherit);opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.1}.kpi span{font-size:.8rem;color:var(--muted)}
.gtbl td,.gtbl th{text-align:center;padding:6px 4px}.gtbl td:first-child,.gtbl th:first-child{text-align:left;white-space:nowrap}
.st{display:inline-grid;place-items:center;width:30px;height:28px;border-radius:7px;font-weight:800;font-size:.85rem;border:0}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.al{background:var(--warn-bg);color:var(--warn)}.st.no{background:var(--bad-bg);color:var(--bad)}.st.na{background:none;color:var(--muted)}.st.an{background:var(--info-bg);color:var(--info)}
button.st{cursor:pointer}
.gtbl tr.fech td{color:var(--muted);background:var(--sunk)}
.pfeito{display:flex;flex-direction:column;align-items:flex-start;gap:4px}.pfeito .ok{color:var(--ok);font-weight:700;font-size:.8rem;white-space:nowrap}
@media (max-width:760px){
 .cal{grid-template-columns:1fr}.cal .wd,.cal .out,.cal .vz{display:none}
 .cal .d{min-height:0;border-left:0;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:10px 12px}
 .cal .n{order:-1;align-self:auto;min-width:28px;font-weight:700;color:var(--ink)}
 .cal .wl{display:inline;order:-2;font-weight:700;color:var(--muted);font-size:.78rem;text-transform:uppercase;width:34px}
 .cal.f .d:not(.has){display:none}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;font-weight:700;color:var(--muted)}
.nav button svg{width:22px;height:22px}.nav button[aria-current="page"]{color:var(--red-2)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:.9rem;z-index:40;max-width:calc(100% - 32px)}
@media (max-width:420px){.esc-btn{padding:6px 10px;font-size:.78rem}.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header class="hdr"><div class="hdr-in">
 <div class="logo"><img src="emblema.jpg" alt="Logo Matuto da China"></div>
 <div class="brand"><b>Matuto da China</b><small>Rotinas da casa</small></div>
 <button class="esc-btn" id="escBtn">Escala de Folgas</button>
</div></header>
<main id="app"></main>
<nav class="nav" aria-label="Menu"><div class="nav-in">
 <button data-nav="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v3h6V3"/><path d="m8.5 13 2.5 2.5 4.5-5"/></svg>Hoje</button>
 <button data-nav="prod"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20V10l4 3V9l4 3V7l4 3v10"/></svg>Produção</button>
 <button data-nav="limp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3 8 13M6 13h8l2 8H4z"/></svg>Limpeza</button>
 <button data-nav="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>Histórico</button>
 <button data-nav="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Ajustes</button>
</div></nav>
<div class="toast" id="toast" hidden></div>
<input type="file" id="bkFile" accept="application/json,.json" hidden>
<script>
(function(){
"use strict";

/* ================= Escala ================= */
function escalaDia(s){const k=mesKey(s),m=cfg.escala[k],d=String(parse(s).getDate());if(!m)return null;
 const fer=[];for(const f in m.ferias){const r=m.ferias[f];if(+d>=r[0]&&+d<=r[1])fer.push(f)}
 return{folga:(m.folgas[d]||[]),comp:((m.compensa||{})[d]||[]),ferias:fer,feriado:(m.feriados||{})[d]||"",seg:parse(s).getDay()===1}}
function statusPessoa(n,s){const e=escalaDia(s);if(!e)return"";if(e.seg)return"Fechado";if(e.ferias.indexOf(n)>=0)return"Férias";if(e.folga.indexOf(n)>=0)return"Folga";if(e.comp.indexOf(n)>=0)return"Folga (comp.)";return"Trabalha"}

function lista(s,t){return cfg.listas[s][t]}
function itemFeito(it,r){const e=r.itens[it.id];if(!e)return false;return it.tipo==="check"?!!e.ok:(e.v!=null&&String(e.v).trim()!=="")}
function foraFaixa(it,r){if(it.tipo!=="temp")return false;const e=r.itens[it.id];if(!e||e.v==null||e.v==="")return false;const n=parseFloat(String(e.v).replace(",","."));return isNaN(n)||n<it.min||n>it.max}
const itensDe=r=>r.lista||lista(r.setor,r.turno);
function contagem(r){const L=itensDe(r);let f=0,x=0;L.forEach(it=>{if(itemFeito(it,r))f++;if(foraFaixa(it,r))x++});return{feitos:f,total:L.length,fora:x}}
function obterRun(s,t){const k=key(diaOp(),s,t);if(!runs[k])runs[k]={setor:s,turno:t,dia:diaOp(),resp:"",inicio:null,fim:null,status:"novo",itens:{},obs:""};return runs[k]}

function chipRun(r){if(!r||r.status==="novo")return'<span class="chip pend"><span class="dot"></span>Pendente</span>';const c=contagem(r);

var SYNC_URL="https://script.google.com/macros/s/AKfycbzFpQNEs_GHExTBrRM_c8QCXqE3BhF9KSH1UA6vV7UkKJ6qHE87MzugK0AjMw1O8Cp-ww/exec";
var SY=LS.get("mdc_sync",{});if(!SY.sent)SY.sent={};if(!SY.dev)SY.dev="ap-"+Math.random().toString(36).slice(2,8);
var res=LS.get("mdc_res",{});
const salvarSY=()=>LS.set("mdc_sync",SY);
function syncOn(){return!!(SY&&SY.tok&&SYNC_URL&&SYNC_URL.indexOf("http")===0)}
function hsh(s){let h=5381;for(let i=0;i<s.length;i++)h=(Math.imul(h,33)^s.charCodeAt(i))|0;return(h>>>0).toString(36)+"."+s.length}
function recsLocais(){const R={};
 Object.keys(runs).forEach(k=>{if(runs[k].status!=="novo")R["run|"+k]=runs[k]});
 Object.keys(prods).forEach(k=>R["prod|"+k]=prods[k]);
 Object.keys(limp).forEach(k=>R["limp|"+k]=limp[k]);
 Object.keys(res).forEach(k=>R["res|"+k]=res[k]);
 Object.keys(cfg).forEach(f=>{if(f==="ultimoResp")return;if(f==="escala"||f==="limpeza")Object.keys(cfg[f]).forEach(m=>R["cfg|"+f+"|"+m]=cfg[f][m]);else R["cfg|"+f]=cfg[f]});
 return R}
function aplicarRec(t,k,v){const set=(o,kk)=>{if(v==null)delete o[kk];else o[kk]=v};
 if(t==="run")set(runs,k);else if(t==="prod")set(prods,k);else if(t==="limp")set(limp,k);else if(t==="res")set(res,k);
 else if(t==="cfg"){const i=k.indexOf("|");if(i>0){const f=k.slice(0,i);cfg[f]=cfg[f]||{};set(cfg[f],k.slice(i+1))}else if(v!=null)cfg[k]=v}}
function linhaPlanilha(t,k,v){
 if(t==="run"&&v){const L=itensDe(v),c=contagem(v),pend=L.filter(it=>!itemFeito(it,v)).map(it=>it.t),fora=L.filter(it=>foraFaixa(it,v)).map(it=>it.t+": "+v.itens[it.id].v+" °C");
  return{aba:"Checklists",cab:["Chave","Data","Setor","Turno","Responsável","Situação","Início","Fim","Feitos","Itens não feitos","Temperatura fora da faixa","Observações"],
   v:[k,dataCurta(v.dia),nomeSetor(v.setor),nomeTurno(v.turno),v.resp||"",v.status==="concluido"?"Concluído":"Em andamento",v.inicio?hhmm(v.inicio):"",v.fim?hhmm(v.fim):"","'"+c.feitos+" de "+c.total,pend.join("; "),fora.join("; "),v.obs||""]}}
 if(t==="prod"&&v){const c=prodCont(v);
  return{aba:"Produção",cab:["Chave","Data","Fria","Quente","Itens feitos","Ocorrências","Conferido por","Conferido às"],
   v:[k,dataCurta(k),(v.setores.fria||{}).resp||"",(v.setores.quente||{}).resp||"","'"+c.ok+" de "+c.tot,v.ocorr||"",v.conf||"",v.fim?hhmm(v.fim):""]}}
 return null}
let syncBusy=false,syncTimer=null,pendRender=false;
function syncAgendar(){if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(sincronizar,2500)}
function editando(){const a=document.activeElement;return a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
async function sincronizar(){if(!syncOn()||syncBusy)return;syncBusy=true;
 try{
  const r=await fetch(SYNC_URL+"?token="+encodeURIComponent(SY.tok)+"&since="+(SY.since||0)+(SY.planilha?"":"&url=1")).then(x=>x.json());
  if(!r.ok)throw new Error(r.erro==="codigo"?"Código de acesso incorreto":"Erro no servidor");
  if(r.planilha)SY.planilha=r.planilha;
  const L=recsLocais(),prim=!SY.since;let mudou=false;
  (r.recs||[]).forEach(x=>{const id=x.t+"|"+x.k,loc=L[id],hl=loc===undefined?null:hsh(JSON.stringify(loc)),hr=x.v==null?null:hsh(JSON.stringify(x.v));
   if(hl===hr){if(hr)SY.sent[id]=hr;else delete SY.sent[id];return}
   const sujo=loc!==undefined&&SY.sent[id]!==hl;
   if(sujo&&!(prim&&x.t==="cfg"))return;
   aplicarRec(x.t,x.k,x.v);if(hr)SY.sent[id]=hr;else delete SY.sent[id];mudou=true});
  SY.since=r.now;
  if(mudou){LS.set("mdc_cfg",cfg);LS.set("mdc_runs",runs);LS.set("mdc_prod",prods);LS.set("mdc_limp",limp);LS.set("mdc_res",res)}
  const L2=recsLocais(),fila=[];
  Object.keys(L2).forEach(id=>{const s=JSON.stringify(L2[id]),h=hsh(s);if(SY.sent[id]!==h)fila.push({id,h,v:JSON.parse(s)})});
  (SY.del||[]).forEach(id=>{if(L2[id]===undefined)fila.push({id,h:null,v:null})});
  for(let i=0;i<fila.length;i+=40){const parte=fila.slice(i,i+40),recs=[],linhas=[];
   parte.forEach(o=>{const j=o.id.indexOf("|"),t=o.id.slice(0,j),k=o.id.slice(j+1);recs.push({t,k,v:o.v});const l=linhaPlanilha(t,k,o.v);if(l)linhas.push(l)});
   const p=await fetch(SYNC_URL,{method:"POST",body:JSON.stringify({token:SY.tok,dev:SY.dev,recs,linhas})}).then(x=>x.json());
   if(!p.ok)throw new Error(p.erro==="codigo"?"Código de acesso incorreto":"Erro no servidor");
   parte.forEach(o=>{if(o.h)SY.sent[o.id]=o.h;else{delete SY.sent[o.id];SY.del=(SY.del||[]).filter(x=>x!==o.id)}})}
  SY.ult=Date.now();SY.err="";salvarSY();
  if(mudou){if(editando())pendRender=true;else render()}else if(view.n==="ajustes"||view.n==="hist")atualizarStatusSync();
 }catch(e){SY.err=String(e&&e.message||e);if(/fetch|network|Load failed/i.test(SY.err))SY.err="Sem internet no momento";salvarSY();atualizarStatusSync()}
 finally{syncBusy=false}}
function textoSync(){if(!syncOn())return'<span class="sy off">● Desligado</span> Os dados ficam só neste aparelho.';
 if(SY.err)return'<span class="sy bad">● '+esc(SY.err)+'</span>'+(SY.ult?' Última atualização às '+hhmm(SY.ult)+(ymd(new Date(SY.ult))!==ymd(new Date())?" de "+dataCurta(ymd(new Date(SY.ult))):"")+'.':"");
 return SY.ult?'<span class="sy ok">● Online</span> Atualizado às '+hhmm(SY.ult)+(ymd(new Date(SY.ult))!==ymd(new Date())?" de "+dataCurta(ymd(new Date(SY.ult))):"")+'.':'<span class="sy">● Conectando…</span>'}
function atualizarStatusSync(){document.querySelectorAll("[data-systatus]").forEach(e=>e.innerHTML=textoSync())}
function cardSync(){return'<section class="card"><header><h2>Acesso online</h2></header><div class="body"><p style="margin:0" data-systatus>'+textoSync()+'</p>'+
 (syncOn()?'<p class="muted small" style="margin:0">Checklists, produção, limpeza, escala e ocorrências vão para a planilha Google da gerência e aparecem em todos os aparelhos conectados.</p><div class="rowbtn"><button class="btn sec sm" data-syagora>Atualizar agora</button>'+(SY.planilha?'<a class="btn sec sm" href="'+esc(SY.planilha)+'" target="_blank" rel="noopener">Abrir planilha</a>':"")+(liberado?'<button class="btn ghost sm" data-syoff>Desconectar este aparelho</button>':"")+'</div>':
 '<p class="muted small" style="margin:0">Conecte para ver os checklists e as observações de qualquer lugar. Digite o código de acesso da gerência.</p><div class="rowbtn"><input class="inp" id="syTok" placeholder="Código de acesso" autocapitalize="characters" style="flex:1 1 180px"><button class="btn pri sm" data-syon>Conectar</button></div>')+'</div></section>'}
function conectar(tok){SY.tok=tok.trim().toUpperCase();SY.since=0;SY.err="";SY.ult=0;salvarSY();sincronizar().then(()=>{if(SY.err)toast(SY.err);else toast("Conectado");render()})}

function problemas(a,b){const hoje=diaOp(),P=[];const dias0=Object.keys(runs).map(k=>k.slice(0,10)).sort();const inicio=dias0[0]||hoje;
 for(let d=b;d>=a;d=addDias(d,-1)){
  const nf=[];
  SETORES.forEach(s=>TURNOS.forEach(t=>{const k=key(d,s.id,t.id),r=runs[k],onde=s.nome+" · "+t.nome;
   if(!r||r.status==="novo"){if(d<hoje&&d>=inicio&&parse(d).getDay()!==1)nf.push(onde);return}
   const L=itensDe(r);
   L.forEach(it=>{if(foraFaixa(it,r))P.push({id:"temp|"+k+"|"+it.id,dia:d,onde,tipo:"Temperatura fora da faixa",txt:it.t+": "+r.itens[it.id].v+" °C (ideal "+it.min+" a "+it.max+" °C)",quem:r.resp,ts:(r.itens[it.id]||{}).h||r.fim,rel:k})});
   if(r.status==="concluido"){const pend=L.filter(it=>!itemFeito(it,r)).map(it=>it.t);if(pend.length)P.push({id:"pend|"+k,dia:d,onde,tipo:"Itens não feitos",txt:pend.join(" · "),quem:r.resp,ts:r.fim,rel:k})}
   if(r.obs&&r.obs.trim())P.push({id:"obs|"+k,dia:d,onde,tipo:"Observação",txt:r.obs.trim(),quem:r.resp,ts:r.fim||r.inicio,rel:r.status==="concluido"?k:""})}));
  const p=prods[d];if(p&&p.ocorr&&p.ocorr.trim())P.push({id:"pocorr|"+d,dia:d,onde:"Produção",tipo:"Ocorrência da produção",txt:p.ocorr.trim(),quem:p.conf,ts:p.fim,prel:p.fim?d:""});
  if(nf.length)P.push({id:"nf|"+d,dia:d,onde:"Checklists",tipo:"Checklist não feito",txt:nf.join(" · ")})}
 return P}

function ocorrencias(){const f=view.of||"abertas",dias=+(view.od||7),hoje=diaOp(),a=addDias(hoje,-(dias-1));
 const T=problemas(a,hoje),L=T.filter(p=>f==="todas"?true:f==="abertas"?!res[p.id]:!!res[p.id]);

 h+='<div class="tool"><div class="tabs">'+[["abertas","Em aberto ("+T.filter(p=>!res[p.id]).length+")"],["resolvidas","Resolvidas"],["todas","Todas"]].map(([k,n])=>'<button data-of="'+k+'" aria-pressed="'+(k===f)+'">'+n+'</button>').join("")+'</div>'+

 if(!L.length)return h+'<div class="note ok"><b>'+(f==="abertas"?"Nenhuma ocorrência em aberto.":"Nada por aqui.")+'</b>Observações, temperaturas fora da faixa, itens não feitos e ocorrências da produção aparecem nesta lista.</div>';
 let dia="";L.forEach(p=>{if(p.dia!==dia){dia=p.dia;h+='<p class="eyebrow" style="margin:6px 0 -4px">'+esc(dataLonga(dia))+'</p>'}
  const rv=res[p.id],cl={"Observação":"info","Temperatura fora da faixa":"alert","Itens não feitos":"and","Ocorrência da produção":"info","Checklist não feito":"alert"}[p.tipo];
  h+='<article class="card oco'+(rv?" res":"")+'"><div class="body"><div class="row" style="align-items:flex-start"><div><span class="chip '+cl+'">'+esc(p.tipo)+'</span> <b>'+esc(p.onde)+'</b></div><span class="muted small">'+(p.quem?esc(p.quem):"")+(p.ts?" · "+hhmm(p.ts):"")+'</span></div>'+
  '<p class="oco-t">'+esc(p.txt)+'</p>';
  if(rv)h+='<div class="row" style="align-items:center"><span class="small" style="color:var(--ok)"><b>✓ Resolvido</b> por '+esc(rv.quem)+' · '+esc(dataCurta(ymd(new Date(rv.ts))).slice(0,5))+' '+hhmm(rv.ts)+(rv.nota?' — '+esc(rv.nota):"")+'</span><button class="btn xs ghost" data-resdesf="'+esc(p.id)+'">Desfazer</button></div>';
  else if(view.resolv===p.id)h+='<div class="rowbtn" style="align-items:center"><select class="inp" id="rQuem" style="flex:1 1 140px">'+optsFunc(view.rq||"",["Gerência"])+'</select><input class="inp" id="rNota" placeholder="O que foi feito (opcional)" style="flex:2 1 200px"><button class="btn pri sm" data-resok="'+esc(p.id)+'">OK</button><button class="btn ghost sm" data-resx>Cancelar</button></div>';
  else h+='<div class="rowbtn"><button class="btn sec sm" data-resolver="'+esc(p.id)+'">Marcar como resolvido</button>'+(p.rel?'<button class="btn ghost sm" data-rel="'+esc(p.rel)+'">Ver checklist</button>':"")+(p.prel?'<button class="btn ghost sm" data-prel="'+esc(p.prel)+'">Ver produção</button>':"")+'</div>';
  h+='</div></article>'});
 return h}

 if("voltaritens" in d){$("#fimArea").innerHTML='<button class="btn pri" data-concluir>Concluir checklist</button>';const p=app.querySelector(".item:not(.done)");if(p)p.scrollIntoView({behavior:"smooth",block:"center"});return}
 if("copiar" in d){copiar(textoRel(runs[view.k]));return}
 if("reabrir" in d){const r=runs[view.k];r.status="andamento";r.fim=null;delete r.lista;salvar();ir({n:"check",k:view.k});return}
 if(d.rel){ir({n:"rel",k:d.rel,de:"hist"});return}
 if("syon" in d){const v=$("#syTok").value;if(!v.trim()){toast("Digite o código de acesso");return}conectar(v);return}
 if("syoff" in d){SY={sent:{},dev:SY.dev};salvarSY();render();toast("Aparelho desconectado");return}
 if("syagora" in d){toast("Atualizando…");sincronizar().then(()=>{toast(SY.err||"Tudo atualizado");render()});return}
 if(d.of){view.of=d.of;render();return}
 if(d.resolver){view.resolv=d.resolver;render();const s=$("#rQuem");if(s)s.focus();return}
 if("resx" in d){view.resolv=null;render();return}
 if(d.resok){const q=$("#rQuem").value;if(!q){toast("Escolha quem resolveu");return}res[d.resok]={quem:q,ts:Date.now(),nota:$("#rNota").value.trim()};view.rq=q;view.resolv=null;salvar();render();toast("Marcado como resolvido");return}
 if(d.resdesf){delete res[d.resdesf];SY.del=(SY.del||[]).concat("res|"+d.resdesf);salvar();render();return}
 if(d.prel){ir({n:"prel",dia:d.prel});return}
 if(d.filtro){filtro=d.filtro;render();return}
 if(d.hm){view.hm=HM.hm=d.hm;HM.ref=view.ref=null;render();return}
 if(d.rref){const n=+d.rref,hm=view.hm||HM.hm;if(!n)view.ref=diaOp();else{const r=parse(view.ref||HM.ref||addDias(diaOp(),-1));if(hm==="sem")r.setDate(r.getDate()+7*n);else{r.setDate(1);r.setMonth(r.getMonth()+n)}view.ref=ymd(r)}HM.ref=view.ref;render();return}
 // produção
 if(d.pdia){const n=+d.pdia;ir({n:"prod",s:view.s,dia:n===0?diaOp():addDias(view.dia||diaOp(),n)});return}
 if(d.pset){view.s=d.pset;render();return}
 if(d.psem){const p=obterProd(view.dia||diaOp()),sp=p.setores[view.s||"fria"],e=sp.itens[d.psem]||(sp.itens[d.psem]={});e.sem=!e.sem;salvar();render();return}
 if("pcopiar" in d){const dia=view.dia||diaOp(),p=obterProd(dia),ant=prods[addDias(dia,-1)];if(!ant){toast("Não há planejamento no dia anterior");return}
  PSET.forEach(x=>{const a=ant.setores[x.id].itens;for(const id in a){if(a[id].plan||a[id].sem){const e=p.setores[x.id].itens[id]||(p.setores[x.id].itens[id]={});if(!e.plan)e.plan=a[id].plan||"";e.sem=!!a[id].sem;if(!e.resp)e.resp=a[id].resp||""}}});salvar();render();toast("Planejamento copiado");return}
 if("pconcluir" in d){const dia=view.dia||diaOp(),p=obterProd(dia);if(!p.conf){$("#pFim").innerHTML='<div class="note bad"><b>Escolha quem conferiu.</b>Selecione o nome em "Conferido por".</div><button class="btn pri" data-pconcluir>Concluir e enviar relatório</button>';return}
  p.fim=Date.now();salvar();ir({n:"prel",dia});return}
 if(d.pcopy){copiar(textoProd(d.pcopy));return}
 if(d.pfeito){view.psign=d.pfeito;render();return}
 if(d.pok){const v=$("#pQuem").value;if(!v){toast("Escolha quem fez");return}const sp=obterProd(view.dia||diaOp()).setores[view.s||"fria"],e=sp.itens[d.pok]||(sp.itens[d.pok]={});e.feito={quem:v,ts:Date.now()};if(!e.resp)e.resp=v;view.psign=null;salvar();render();toast("Item marcado como feito");return}
 if(d.pdesf){const e=obterProd(view.dia||diaOp()).setores[view.s||"fria"].itens[d.pdesf];if(e)delete e.feito;salvar();render();return}
 // limpeza
 if(d.lmes){ir({n:"limp",k:d.lmes});return}
 if(d.lfeito){view.sign=d.lfeito;render();return}
 if(d.gerir){if(liberado)gerir(d.gerir);else{view.askPin=d.gerir;render();const i=$("#pin2");if(i)i.focus()}return}
 if("pin2" in d){if($("#pin2").value===String(cfg.pin)){liberado=true;const a=view.askPin;view.askPin=null;gerir(a)}else toast("Senha incorreta");return}
 if("pin2x" in d){view.askPin=null;render();return}
 if(d.voltar){const [n,k]=d.voltar.split("|");ir({n,k:k||undefined});return}
 if(d.lok){const v=$("#lQuem").value;if(!v){toast("Escolha quem fez");return}const [id,w]=d.lok.split("|");limp[lk(view.k||mesKey(diaOp()),id,w)]={quem:v,ts:Date.now()};view.sign=null;salvar();render();toast("Limpeza registrada");return}
 if(d.ldesf){const [id,w]=d.ldesf.split("|"),kk=lk(view.k||mesKey(diaOp()),id,w);delete limp[kk];SY.del=(SY.del||[]).concat("limp|"+kk);salvar();render();return}
 if(d.tfeito){const t=cfg.terceiros.find(x=>x.id===d.tfeito);t.ultima=diaOp();salvar();render();toast("Serviço registrado hoje");return}
 // escala
 if(d.emes){view.k=d.emes;view.dia=null;render();return}
 if("eclose" in d){view.edit=false;view.dia=null;render();return}
 if(d.edmv){const m=cfg.escala[view.k],[y,mo]=view.k.split("-").map(Number),n=new Date(y,mo,0).getDate();view.dia=Math.min(n,Math.max(1,(view.dia||1)+(+d.edmv)));render();return}
 if(d.ef||d.ec){const m=cfg.escala[view.k],campo=d.ef?"folgas":"compensa",nome=d.ef||d.ec;m[campo]=m[campo]||{};const L=m[campo][view.dia]||(m[campo][view.dia]=[]);const i=L.indexOf(nome);if(i>=0)L.splice(i,1);else L.push(nome);if(!L.length)delete m[campo][view.dia];salvar();render();return}
 if("efadd" in d){const n=$("#efN").value,a=parseInt($("#efA").value,10),b=parseInt($("#efB").value,10);if(!n||!(a>0)||!(b>=a)){toast("Escolha o nome e os dias de início e fim");return}const m=cfg.escala[view.k];m.ferias=m.ferias||{};m.ferias[n]=[a,b];salvar();render();return}
 if(d.efdel){delete cfg.escala[view.k].ferias[d.efdel];salvar();render();return}
 if("enovo" in d){const ks=Object.keys(cfg.escala).sort(),u=ks[ks.length-1],[y,mo]=u.split("-").map(Number),nd=new Date(y,mo,1),k=nd.getFullYear()+"-"+pad(nd.getMonth()+1);cfg.escala[k]={nome:nomeMes(k).replace(" de "," "),folgas:{},compensa:{},feriados:{},ferias:{},notas:[]};salvar();view.k=k;view.dia=null;render();toast("Mês criado. Toque nos dias para lançar as folgas.");return}
 if("elimpar" in d){$("#eLimparArea").innerHTML='<div class="note bad"><b>Apagar todas as folgas de '+esc(cfg.escala[view.k].nome)+'?</b>Feriados, férias e anotações ficam.</div><div class="rowbtn" style="margin-top:8px"><button class="btn sec sm" data-ecancel>Cancelar</button><button class="btn danger sm" data-elimpok>Apagar folgas</button></div>';return}
 if("ecancel" in d){$("#eLimparArea").innerHTML="";return}
 if("elimpok" in d){const m=cfg.escala[view.k];m.folgas={};m.compensa={};salvar();render();toast("Folgas apagadas");return}
 // ajustes
 if("pin" in d){if($("#pin").value===String(cfg.pin)){liberado=true;render()}else toast("Senha incorreta");return}
 if("novopin" in d){const v=$("#novoPin").value.trim();if(v.length<4){toast("Use pelo menos 4 dígitos");return}cfg.pin=v;salvar();toast("Senha trocada");$("#novoPin").value="";return}
 if(d.editar){const [kind,s,t]=d.editar.split("|");ir({n:"editar",ed:{kind,s,t}});return}
 if("edfunc" in d){ir({n:"edfunc"});return}
 if(d.edlimp){ir({n:"edlimp",k:d.edlimp});return}
 if("edterc" in d){ir({n:"edterc"});return}
 if("backup" in d){const blob=new Blob([JSON.stringify({cfg,runs,prods,limp,res,data:Date.now()})],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="backup-matuto-"+diaOp()+".json";document.body.appendChild(a);a.click();a.remove();toast("Backup baixado");return}
 if("restore" in d){$("#bkFile").click();return}
 if("limpar" in d){$("#limparArea").innerHTML='<div class="note bad"><b>Apagar checklists, produções e limpezas registradas neste aparelho?</b>As configurações ficam. Isso não pode ser desfeito.</div><div class="rowbtn" style="margin-top:8px"><button class="btn sec sm" data-ir="ajustes">Cancelar</button><button class="btn danger sm" data-limparok>Apagar</button></div>';return}
 if("limparok" in d){runs={};prods={};limp={};salvar();toast("Histórico apagado");render();return}
 if(view.n==="editar"){const L=listaEd(),idx=id=>L.findIndex(x=>x.id===id);
  if(d.edel){L.splice(idx(d.edel),1);salvar();render();return}
  if(d.eup){const i=idx(d.eup);[L[i-1],L[i]]=[L[i],L[i-1]];salvar();render();return}
  if(d.edown){const i=idx(d.edown);[L[i+1],L[i]]=[L[i],L[i+1]];salvar();render();return}
  if("eadd" in d){const n=view.ed.kind==="check"?C("Novo item"):I("Novo item");L.push(n);salvar();render();const el=$("#e_"+n.id);if(el){el.focus();el.select()}return}
  if("erestaurar" in d){const e=view.ed;if(e.kind==="check")cfg.listas[e.s][e.t]=listasPadrao()[e.s][e.t];else cfg.producao[e.s]=producaoPadrao()[e.s];salvar();render();toast("Lista padrão restaurada");return}}
 if(d.fdel){cfg.funcionarios.splice(+d.fdel,1);salvar();render();return}
 if("fadd" in d){cfg.funcionarios.push("Novo nome");salvar();render();return}
 if(d.ldel){const T=cronograma(view.k);T.splice(T.findIndex(x=>x.id===d.ldel),1);salvar();render();return}
 if("ladd" in d){cronograma(view.k).push(L_("Nova área","Semanal",["","","",""]));salvar();render();return}
 if(d.tdel){cfg.terceiros=cfg.terceiros.filter(x=>x.id!==d.tdel);salvar();render();return}
 if("tadd" in d){cfg.terceiros.push({id:uid(),nome:"Novo serviço",meses:1,ultima:diaOp()});salvar();render();return}
});
app.addEventListener("input",ev=>{const el=ev.target,d=el.dataset;
 if(el.id==="obs"){runs[view.k].obs=el.value;salvar();return}
 if(el.id==="fone"){cfg.fone=el.value;salvar();return}
 if(d.val){const r=runs[view.k];marcarInicio(r);const e=r.itens[d.val]||(r.itens[d.val]={});e.v=el.value;e.h=el.value.trim()?Date.now():null;salvar();
  const it=itensDe(r).find(x=>x.id===d.val),li=el.closest("li"),f=itemFeito(it,r),x=foraFaixa(it,r);li.classList.toggle("done",f);li.classList.toggle("out",x);li.querySelector(".hint").textContent=(x?"Fora da faixa! Ideal: ":"Ideal: ")+it.min+" a "+it.max+" °C";atualizarProg(r);return}
 if(d.pq){const [campo,id]=d.pq.split("|"),p=obterProd(view.dia||diaOp()),sp=p.setores[view.s||"fria"],e=sp.itens[id]||(sp.itens[id]={});e[campo]=el.value;salvar();const tr=el.closest("tr");return}
 if(el.id==="pResp"){obterProd(view.dia||diaOp()).setores[view.s||"fria"].resp=el.value;salvar();return}
 if(el.id==="pOcorr"){obterProd(view.dia||diaOp()).ocorr=el.value;salvar();return}
 if(view.n==="editar"){const L=listaEd(),f=id=>L.find(x=>x.id===id);
  if(d.et){f(d.et).t=el.value;salvar();return}
  if(d.emin){const n=parseFloat(el.value.replace(",","."));if(!isNaN(n)){f(d.emin).min=n;salvar()}return}
  if(d.emax){const n=parseFloat(el.value.replace(",","."));if(!isNaN(n)){f(d.emax).max=n;salvar()}return}}
 if(d.fn){cfg.funcionarios[+d.fn]=el.value;salvar();return}
 if(d.la){cronograma(view.k).find(x=>x.id===d.la).area=el.value;salvar();return}
 if(d.lr){const [id,w]=d.lr.split("|");cronograma(view.k).find(x=>x.id===id).resp[+w]=el.value;salvar();return}
 if(d.tn){cfg.terceiros.find(x=>x.id===d.tn).nome=el.value;salvar();return}
 if(el.id==="eNotas"){cfg.escala[view.k].notas=el.value.split("\n").map(x=>x.trim()).filter(Boolean);salvar();return}
 if(d.tm){const n=parseInt(el.value,10);if(n>0){cfg.terceiros.find(x=>x.id===d.tm).meses=n;salvar()}return}
});
app.addEventListener("change",ev=>{const el=ev.target,d=el.dataset;
 if(el.id==="resp"){runs[view.k].resp=el.value;salvar();return}
 if(el.id==="quemSel"){quem=el.value;render();return}
 if(el.id==="escSel"){view.q=el.value;render();return}
 if(el.id==="odSel"){view.od=+el.value;render();return}
 if(el.id==="eFer"){const m=cfg.escala[view.k];m.feriados=m.feriados||{};if(el.checked)m.feriados[view.dia]="Feriado";else delete m.feriados[view.dia];salvar();render();return}
 if(d.pr){const p=obterProd(view.dia||diaOp()),sp=p.setores[view.s||"fria"],e=sp.itens[d.pr]||(sp.itens[d.pr]={});e.resp=el.value;salvar();return}
 if(el.id==="pConf"){obterProd(view.dia||diaOp()).conf=el.value;salvar();return}
 if(d.etipo){const it=listaEd().find(x=>x.id===d.etipo);it.tipo=el.value;if(it.tipo==="temp"&&it.min==null){it.min=0;it.max=5}salvar();render();return}
 if(d.lf){cronograma(view.k).find(x=>x.id===d.lf).freq=el.value;salvar();return}
 if(d.tu){if(el.value){cfg.terceiros.find(x=>x.id===d.tu).ultima=el.value;salvar()}return}
});
app.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="pin"){ev.preventDefault();app.querySelector("[data-pin]").click()}if(ev.key==="Enter"&&ev.target.id==="pin2"){ev.preventDefault();app.querySelector("[data-pin2]").click()}});
$("#bkFile").addEventListener("change",ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.cfg)throw 0;cfg=o.cfg;runs=o.runs||{};prods=o.prods||{};limp=o.limp||{};if(o.res)res=o.res;salvar();toast("Backup restaurado");render()}catch(e){toast("Arquivo de backup inválido")}};rd.readAsText(f);ev.target.value=""});
(function(){const mt=location.hash.match(/[#&]c=([A-Za-z0-9-]+)/);if(mt){history.replaceState(null,"",location.pathname+location.search);if(SY.tok!==mt[1].toUpperCase()){SY.tok=mt[1].toUpperCase();SY.since=0;SY.err="";salvarSY()}}})();
app.addEventListener("focusout",()=>{if(pendRender)setTimeout(()=>{if(pendRender&&!editando()){pendRender=false;render()}},300)});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sincronizar()});window.addEventListener("online",()=>sincronizar());
setInterval(()=>{if(!document.hidden)sincronizar()},60000);setTimeout(sincronizar,800);
render();
})();
</script>
